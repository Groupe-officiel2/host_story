services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hoststory-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - mailpit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hoststory

  vite:
    image: node:20-alpine
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: hoststory-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - hoststory

  db:
    image: mysql:8.0
    container_name: hoststory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: host_story_dev
      MYSQL_USER: hoststory_user
      MYSQL_PASSWORD: hoststory2026
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - hoststory

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hoststory-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - hoststory
  
  certbot:
    image: certbot/certbot
    container_name: certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    
    command: >
      certonly --non-interactive --keep-until-expiring --webroot --webroot-path=/var/www/certbot
       --email hoststory.game@gmail.com --agree-tos --no-eff-email
       -d hoststory.fr -d www.hoststory.fr


volumes:
  mysql-data:

networks:
  hoststory:
    driver: bridge
